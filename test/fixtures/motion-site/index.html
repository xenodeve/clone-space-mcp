<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clone-space-mcp motion fixture</title>

    <!--
      Every element carrying data-fixture-id corresponds to one entry in
      fixture-manifest.json, and the conformance test compares the two sets in both
      directions. Adding a case here without declaring it there fails the suite, and
      so does the reverse.

      Elements carrying data-identity-case are the hard cases for the wa: identity
      scheme. They are tracked separately because they are not motion mechanisms.
    -->

    <link rel="stylesheet" href="/style.css" />
    <link
      data-fixture-id="cross-origin-theme"
      rel="stylesheet"
      href="__CROSS_ORIGIN__theme.css"
    />
  </head>

  <body>
    <header class="hero">
      <h1 data-fixture-id="gsap-hero" class="hero__title">clone-space-mcp</h1>
      <p data-fixture-id="gsap-nested-only">only a nested tween animates this</p>
      <p class="hero__sub">A page that declares exactly what it contains.</p>
      <div data-fixture-id="css-keyframes-pulse" class="pulse" aria-hidden="true"></div>
      <div data-fixture-id="waapi-slide" class="slider" aria-hidden="true"></div>
    </header>

    <section class="section">
      <h2>Carousel</h2>
      <div data-fixture-id="carousel-main" class="carousel">
        <ul class="carousel__track">
          <li class="carousel__slide" style="--slide: 0">one</li>
          <li class="carousel__slide" style="--slide: 1">two</li>
          <li class="carousel__slide" style="--slide: 2">three</li>
        </ul>
        <button class="carousel__btn" data-dir="-1" type="button">Prev</button>
        <button class="carousel__btn" data-dir="1" type="button">Next</button>
      </div>
    </section>

    <section class="section">
      <h2>Identity hard cases</h2>

      <ul data-identity-case="duplicate-siblings" class="dupes">
        <li></li>
        <li></li>
        <li></li>
      </ul>

      <shadow-card data-identity-case="shadow-dom"></shadow-card>

      <iframe
        data-identity-case="iframe"
        src="/frame.html"
        title="nested document"
        width="240"
        height="120"
      ></iframe>

      <div data-identity-case="delayed-insertion" class="host"></div>
      <div data-identity-case="delete-and-reinsert" class="host"><span class="flicker"></span></div>
    </section>

    <section class="section">
      <h2>Inserted after load</h2>
      <div data-fixture-id="dynamic-late-block" class="host"></div>
    </section>

    <section class="spacer">
      <p>Scroll past this.</p>
    </section>

    <section class="section">
      <h2>Scroll-driven</h2>
      <div data-fixture-id="gsap-scroll-panel" class="panel"></div>
    </section>

    <section class="section">
      <h2>Lazy</h2>
      <!--
        The URL lives only in data-lazy-src. A plain src= would be fetched while the
        document is still parsing, which would make the capture sweep unnecessary and
        the case pointless.
      -->
      <img
        data-fixture-id="lazy-hero-panel"
        data-lazy-src="/assets/lazy-panel.svg"
        alt="lazily loaded panel"
        width="320"
        height="180"
      />
    </section>

    <script src="/vendor/gsap.min.js"></script>
    <script src="/vendor/ScrollTrigger.min.js"></script>
    <script data-fixture-id="sourcemap-module" src="/build/instrumented.js"></script>
    <script src="/motion.js"></script>
    <script src="/gsap-scene.js"></script>
  </body>
</html>
